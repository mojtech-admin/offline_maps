name: Build iPhone app

# Every push that touches the app is compiled (no Apple account needed).
# Run it by hand with "upload" ticked to sign the app and send it to TestFlight.
on:
  push:
    branches: [main]
    paths: ["App/**", "project.yml", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to TestFlight / App Store Connect"
        type: boolean
        default: false

env:
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.example.offroute' }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  BUILD_NUMBER: ${{ github.run_number }}
  MAP_BASE_URL: https://github.com/${{ github.repository }}/releases/download/maps-v1/

jobs:
  build:
    runs-on: macos-26          # ships Xcode 26, which App Store uploads require
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Compile check (unsigned)
        if: ${{ !inputs.upload }}
        run: |
          set -o pipefail
          xcodebuild build -project OffRoute.xcodeproj -scheme OffRoute -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || (tail -50 build.log; exit 1)
          grep -q "BUILD SUCCEEDED" build.log

      - name: Archive
        if: ${{ inputs.upload }}
        run: |
          set -o pipefail
          xcodebuild archive -project OffRoute.xcodeproj -scheme OffRoute -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/OffRoute.xcarchive \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || (tail -50 build.log; exit 1)
          grep -q "ARCHIVE SUCCEEDED" build.log

      - name: Sign with Apple cloud signing and export
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/OffRoute.xcarchive -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/export

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f build/export/OffRoute.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
