# XcodeGen spec. The cloud build runs `xcodegen generate` to create OffRoute.xcodeproj,
# so no Mac is needed to maintain the Xcode project.
# ${...} values come from environment variables set in .github/workflows/ios.yml.
name: OffRoute
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
targets:
  OffRoute:
    type: application
    platform: iOS
    sources:
      - path: App
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OffRoute
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: OffRoute watches the road through the camera to measure your speed and read road signs. Pictures are processed on your iPhone and are never saved or sent anywhere.
        NSMotionUsageDescription: OffRoute uses the motion sensors to follow your car's movement without GPS.
        ITSAppUsesNonExemptEncryption: false
        MapPackBaseURL: ${MAP_BASE_URL}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
